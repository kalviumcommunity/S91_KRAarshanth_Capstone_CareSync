services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file:
      - server/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/ihros
      PORT: 5000
      UPLOAD_DIR: /app/server/uploads
    ports:
      - "${HOST_PORT:-5000}:5000"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - uploaded-files:/app/server/uploads

volumes:
  mongo-data:
  uploaded-files:
